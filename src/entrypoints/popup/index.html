<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabSync</title>
  </head>
  <body>
    <main>
      <header>
        <div class="logo">T</div>
        <div>
          <h1>TabSync</h1>
          <p id="summary">Загрузка…</p>
        </div>
      </header>

      <section id="details" hidden>
        <div><span>Вкладок</span><strong id="tab-count">0</strong></div>
        <div><span>Закладок</span><strong id="bookmark-count">0</strong></div>
        <div><span>Последняя синхронизация</span><strong id="last-sync">—</strong></div>
      </section>

      <p id="warning" class="warning" hidden></p>
      <p id="error" class="error" hidden></p>

      <div id="actions" class="actions"></div>

      <footer>
        Вкладки синхронизируются автоматически. Синхронизацию всех закладок можно
        включить одним переключателем.
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
